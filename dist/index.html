<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de Recuerdos</title>
  <link rel="stylesheet" crossorigin href="/assets/index-ctZ2wVRf.css">
</head>
<body>

<header class="header">
  <div class="container header-content">
    <a href="#" class="logo" data-nav="home">📸 Álbum de Recuerdos</a>
    <nav class="nav">
      <a href="#" data-nav="home" class="nav-link active">Inicio</a>
      <a href="#" data-nav="admin" class="nav-link">Admin</a>
      <a href="#" data-nav="contacto" class="nav-link">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="home" class="section active">
    <div class="container">
      <h1 class="section-title">Mis Recuerdos</h1>
      <p style="text-align:center; margin-bottom:20px; color:#666;">Sube fotos en <a href="#" data-nav="admin">Admin</a></p>
      <div id="gallery" class="gallery"></div>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="section">
    <div class="container">
      <h1 class="section-title">Panel de Administración</h1>
      
      <div class="admin-card">
        <h2>Subir Foto</h2>
        <div id="drop-zone" class="drop-zone">
          <input type="file" id="photo-upload" accept="image/*" class="file-input">
          <label for="photo-upload" class="upload-label">
            <span class="upload-icon">📁</span>
            <span>Seleccionar foto</span>
          </label>
          <p class="upload-hint">O arrastra y suelta una foto aquí</p>
          <div id="file-info" class="file-info"></div>
        </div>
      </div>
      
      <div class="admin-card">
        <h2>Gestión de Fotos</h2>
        <button class="btn btn-danger" id="btn-reset">Eliminar Todas las Fotos</button>
      </div>
      
      <div class="admin-card">
        <h2>Lista de Fotos</h2>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="admin-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTACTO -->
  <section id="contacto" class="section">
    <div class="container">
      <h1 class="section-title">Contacto</h1>
      <div class="contact-card">
        <form name="formulario" id="form-contacto">
          <p><label>Fecha: <input type="date" name="fecha" value="2017-02-05" required></label></p>
          <p><label>Nombre: <input type="text" name="nombre" maxlength="15" required></label></p>
          <p><label>Edad: <input type="number" name="edad" min="1" max="150" required></label></p>
          <p><label>Correo: <input type="email" name="correo" required></label></p>
          <p><label>Teléfono: <input type="tel" name="telefono" pattern="[0-9\+ ]{7,20}"></label></p>
          <p><label>Sitio Web: <input type="url" name="sitioweb"></label></p>
          <p><input type="submit" value="Enviar" class="btn btn-primary"></p>
        </form>
        <div id="contacto-msg" class="contacto-msg"></div>
      </div>
    </div>
  </section>
</main>

<div id="editor-overlay" class="editor-overlay">
  <div class="editor-panel">
    <div class="editor-header">
      <h2>Editar foto</h2>
      <span class="editor-close" onclick="closeEditor()">&times;</span>
    </div>
    <div class="editor-body">
      <div class="editor-preview">
        <canvas id="editor-canvas"></canvas>
      </div>
      <div class="editor-sidebar">
        <div class="editor-section">
          <h3>Filtros</h3>
          <div class="editor-filters">
            <button class="btn-filter active" data-filter="none" onclick="setEditorFilter('none')">Original</button>
            <button class="btn-filter" data-filter="grayscale" onclick="setEditorFilter('grayscale')">B/N</button>
            <button class="btn-filter" data-filter="sepia" onclick="setEditorFilter('sepia')">Sepia</button>
            <button class="btn-filter" data-filter="invert" onclick="setEditorFilter('invert')">Invertir</button>
          </div>
        </div>
        <div class="editor-section">
          <h3>Compresión</h3>
          <div class="editor-quality-row">
            <input type="range" id="editor-quality" min="10" max="100" value="80">
            <span id="editor-quality-val">80%</span>
          </div>
        </div>
        <p id="editor-info" class="editor-info"></p>
        <div id="upload-progress" class="upload-progress" style="display:none">
          <div class="upload-progress-bar">
            <div id="upload-progress-fill" class="upload-progress-fill"></div>
          </div>
        </div>
        <button class="btn btn-primary editor-upload-btn" onclick="uploadFromEditor()">Subir foto</button>
      </div>
    </div>
  </div>
</div>

<div id="fullscreen-overlay" class="fullscreen-overlay">
  <span class="fullscreen-close" onclick="closeFullscreen()">&times;</span>
  <span class="fullscreen-nav fullscreen-prev" onclick="navFullscreen(-1)">&#10094;</span>
  <span class="fullscreen-nav fullscreen-next" onclick="navFullscreen(1)">&#10095;</span>
  <div class="fullscreen-content">
    <img id="fullscreen-img" src="" alt="">
    <p id="fullscreen-caption" class="fullscreen-caption"></p>
    <div id="fullscreen-geo" class="fullscreen-geo"></div>
    <button class="btn btn-primary btn-sm" id="btn-webrtc-share" style="margin-top:10px">Compartir vía WebRTC</button>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <p>&copy; 2026 Álbum de Recuerdos</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
